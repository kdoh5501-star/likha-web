<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>결제 실패 · LIKHA</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<style>.box{max-width:520px;margin:60px auto;padding:0 16px;display:flex;flex-direction:column;gap:16px;text-align:center}.box h1{font-size:24px;font-weight:800}.ic{width:72px;height:72px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto}</style>
</head>
<body>
<div class="box">
  <div class="ic"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></div>
  <h1>결제가 완료되지 않았어요</h1>
  <p class="muted" id="msg">다시 시도하거나 다른 결제 수단을 선택해 주세요.</p>
  <div class="notice warn" id="code" hidden></div>
  <a class="btn btn-accent btn-lg" href="./#checkout">다시 결제하기</a>
  <a class="link" href="./">홈으로</a>
</div>
<script>
  const q=new URLSearchParams(location.search);
  const code=q.get("code"),message=q.get("message");
  if(message){document.getElementById("msg").textContent=message;}
  if(code){const c=document.getElementById("code");c.hidden=false;c.textContent="오류 코드: "+code+(code==="PAY_PROCESS_CANCELED"?" (결제창을 닫았어요)":"");}
</script>
</body>
</html>
